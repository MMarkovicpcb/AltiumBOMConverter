<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOM konverter</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#5d6773;--bd:#d8dde3;--ac:#0b6e99;--acx:#fff;--warn:#fff4d6;--wtx:#6b4b00;--err:#fde8e8;--etx:#8a1f1f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16191d;--card:#1f2328;--tx:#e8ebef;--mut:#9aa5b1;--bd:#363c44;--ac:#4cb3de;--acx:#06222f;--warn:#3a3016;--wtx:#f0d48a;--err:#3d1f1f;--etx:#f3b1b1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16191d;--card:#1f2328;--tx:#e8ebef;--mut:#9aa5b1;--bd:#363c44;--ac:#4cb3de;--acx:#06222f;--warn:#3a3016;--wtx:#f0d48a;--err:#3d1f1f;--etx:#f3b1b1;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}p.sub{margin:0 0 20px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:block;font-size:13px;color:var(--mut)}
input[type=text]{width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
#drop{display:block;border:2px dashed var(--bd);border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;color:var(--mut)}
#drop.over{border-color:var(--ac);color:var(--tx)}
#drop b{color:var(--tx)}
button{padding:10px 18px;border:0;border-radius:8px;background:var(--ac);color:var(--acx);font:600 15px system-ui,sans-serif;cursor:pointer}
.box{border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px}
.warn{background:var(--warn);color:var(--wtx)}.err{background:var(--err);color:var(--etx)}
.box ul{margin:4px 0 0;padding-left:20px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top;white-space:pre-line}
th{background:var(--bg);position:sticky;top:0}tr.fl td{background:var(--warn)}
td.n{white-space:nowrap}.hide{display:none}
</style>
</head>
<body>
<main>
<h1>BOM konverter</h1>
<p class="sub">Ubaci BOM izvezen iz Altiuma (.xlsx) i dobijaš BOM u Loptech formatu sa logom. Fajl se obrađuje u tvom pregledaču i ne šalje se nigde.</p>
<div class="card grid">
<label class="f">Project Title<input type="text" id="title"></label>
<label class="f">Assembly Variant<input type="text" id="variant"></label>
<label class="f">Date<input type="text" id="date"></label>
</div>
<label id="drop"><input type="file" id="file" accept=".xlsx" class="hide"><b>Klikni ili prevuci .xlsx fajl ovde</b><br><span id="fname">Izvorni BOM (npr. LBB_Microphone.xlsx)</span></label>
<div id="out" class="hide">
<div class="card">
<div id="sum"></div><div id="warns"></div>
<button id="dl">Preuzmi BOM (.xlsx)</button>
<div class="tw"><table><thead><tr><th>#</th><th>MPN</th><th>Description</th><th>Designator</th><th>Qty</th><th>Napomena</th></tr></thead><tbody id="tb"></tbody></table></div>
</div></div>
<div id="err" class="box err hide"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
const FIRST = 10, NCOL = 8, LINE_H = 16.5;
const clone = o => JSON.parse(JSON.stringify(o || {}));
function txt(v) {
  if (v == null) return '';
  if (typeof v === 'object') {
    if (v instanceof Date) return v.toISOString();
    if (v.richText) return v.richText.map(t => t.text).join('');
    if ('result' in v) return txt(v.result);
    if (v.text != null) return txt(v.text);
    if (v.hyperlink) return v.hyperlink;
  }
  return String(v);
}
function parseCell(text) {
  text = String(text || '').replace(/_x000D_/g, '').replace(/\r/g, '');
  const items = []; let cur = { desc: null, mpn: null, url: null };
  const flush = () => { if (cur.desc != null || cur.mpn != null || cur.url != null) items.push(cur); cur = { desc: null, mpn: null, url: null }; };
  for (const raw of text.split('\n')) {
    const line = raw.trim(); if (!line) continue;
    if (/^https?:\/\//i.test(line)) {
      const tok = line.split(/\s+/)[0];
      cur.url = tok.replace(/,+$/, '');
      const rest = line.slice(tok.length).trim().replace(/^,+/, '').trim();
      flush(); if (rest) cur.desc = rest;
    } else if (cur.desc == null) cur.desc = line;
    else if (cur.mpn == null) cur.mpn = line;
    else cur.mpn += ' ' + line;
  }
  flush(); return items;
}
function readSource(ws) {
  const head = {};
  ws.getRow(1).eachCell(c => { const k = txt(c.value).trim().toLowerCase(); if (k) head[k] = c.col; });
  const miss = ['description', 'designator', 'quantity'].filter(k => !head[k]);
  if (miss.length) throw new Error('U izvornom fajlu nedostaju kolone: ' + miss.join(', ') + '. Nađeno: ' + Object.keys(head).join(', '));
  const rows = [], notes = [];
  for (let r = 2; r <= ws.rowCount; r++) {
    const des = txt(ws.getCell(r, head.designator).value).trim();
    let q = ws.getCell(r, head.quantity).value; if (q && typeof q === 'object') q = q.result;
    const items = parseCell(txt(ws.getCell(r, head.description).value));
    if (!des && !items.length) continue;
    const j = k => items.map(i => (i[k] || '').trim()).join('\n');
    const row = { mpn: j('mpn'), desc: j('desc'), link: j('url'), designator: des, qty: q === '' ? null : q, src: r, flags: [] };
    if (!items.length) row.flags.push('kolona B je prazna');
    if (items.length > 1) row.flags.push(items.length + ' alternative u istom redu');
    if (items.some(i => !(i.mpn && i.url && i.desc))) row.flags.push('nedostaje opis, MPN ili link');
    const n = des.split(/\s*,\s*/).filter(Boolean).length;
    if (typeof q === 'number' && n !== q) row.flags.push('Quantity ' + q + ' ≠ ' + n + ' designatora');
    rows.push(row);
  }
  return rows;
}
async function buildBom(ExcelJS, srcBytes, tplBytes, o) {
  const src = new ExcelJS.Workbook(); await src.xlsx.load(srcBytes);
  const rows = readSource(src.worksheets[0]);
  const wb = new ExcelJS.Workbook(); await wb.xlsx.load(tplBytes);
  const ws = wb.worksheets[0];
  let last = ws.rowCount;
  for (let r = ws.rowCount; r >= FIRST; r--) { const b = ws.getCell(r, 2).border; if (b && b.bottom && b.bottom.style === 'medium') { last = r; break; } }
  const midRow = last > FIRST ? FIRST + 1 : FIRST, mid = [], end = [];
  for (let c = 1; c <= NCOL; c++) { mid[c] = clone(ws.getCell(midRow, c).style); end[c] = clone(ws.getCell(last, c).style); }
  const blank = clone(ws.getCell(FIRST, NCOL).style);
  for (let r = FIRST; r <= last; r++) { for (let c = 1; c <= NCOL; c++) { const k = ws.getCell(r, c); k.value = null; k.style = clone(blank); } ws.getRow(r).height = undefined; }
  ws.getCell('D4').value = o.title; ws.getCell('D5').value = o.variant; ws.getCell('D6').value = o.date;
  const wrap = k => { k.alignment = Object.assign({}, k.alignment, { wrapText: true, vertical: 'middle' }); };
  rows.forEach((row, i) => {
    const r = FIRST + i, st = i === rows.length - 1 ? end : mid;
    for (let c = 1; c <= NCOL; c++) ws.getCell(r, c).style = clone(st[c]);
    ws.getCell(r, 2).value = row.mpn || null; ws.getCell(r, 3).value = row.desc || null;
    ws.getCell(r, 4).value = row.designator || null; ws.getCell(r, 5).value = row.link || null; ws.getCell(r, 6).value = row.qty;
    const lines = Math.max(...['mpn', 'desc', 'link'].map(k => row[k].split('\n').length));
    if (lines > 1) { [2, 3, 5].forEach(c => wrap(ws.getCell(r, c))); ws.getRow(r).height = LINE_H * lines; }
    if (row.designator.length > 100) { wrap(ws.getCell(r, 4)); ws.getRow(r).height = LINE_H * (Math.floor(row.designator.length / 60) + 1); }
  });
  const buf = await wb.xlsx.writeBuffer();
  return { buf, rows, logo: ws.getImages().length };
}

const $ = id => document.getElementById(id);
let srcBytes = null, srcName = '', result = null;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const d = new Date(), p = n => String(n).padStart(2, '0');
$('date').value = p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + '.';

async function run() {
  if (!srcBytes) return;
  $('err').classList.add('hide');
  try {
    result = await buildBom(ExcelJS, srcBytes, b64(TPL), { title: $('title').value, variant: $('variant').value, date: $('date').value });
    show(result);
  } catch (e) {
    $('out').classList.add('hide'); $('err').textContent = 'Greška: ' + (e && e.message || e); $('err').classList.remove('hide');
  }
}
function show(r) {
  const flagged = r.rows.filter(x => x.flags.length);
  const total = r.rows.reduce((s, x) => s + (typeof x.qty === 'number' ? x.qty : 0), 0);
  $('sum').textContent = r.rows.length + ' redova, ukupna količina ' + total + (r.logo ? ', logo ubačen.' : ', LOGO NIJE UBAČEN.');
  const w = $('warns'); w.textContent = '';
  if (flagged.length) {
    const b = document.createElement('div'); b.className = 'box warn';
    b.append('Proveri ručno:'); const ul = document.createElement('ul');
    flagged.forEach(x => { const li = document.createElement('li'); li.textContent = 'izvor red ' + x.src + ' (' + x.designator.slice(0, 40) + '): ' + x.flags.join('; '); ul.append(li); });
    b.append(ul); w.append(b);
  }
  const tb = $('tb'); tb.textContent = '';
  r.rows.forEach((x, i) => {
    const tr = document.createElement('tr'); if (x.flags.length) tr.className = 'fl';
    [i + 1, x.mpn, x.desc, x.designator, x.qty == null ? '' : x.qty, x.flags.join('; ')].forEach((v, k) => { const td = document.createElement('td'); if (k === 0 || k === 4) td.className = 'n'; td.textContent = v; tr.append(td); });
    tb.append(tr);
  });
  $('out').classList.remove('hide');
}
async function load(f) {
  if (!f) return;
  srcName = f.name; $('fname').textContent = f.name;
  if (!$('title').value || $('title').dataset.auto) { $('title').value = f.name.replace(/\.xlsx$/i, ''); $('title').dataset.auto = '1'; }
  srcBytes = new Uint8Array(await f.arrayBuffer());
  run();
}
$('file').addEventListener('change', e => load(e.target.files[0]));
const dz = $('drop');
['dragenter', 'dragover'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop', e => load(e.dataTransfer.files[0]));
['title', 'variant', 'date'].forEach(id => $(id).addEventListener('change', () => { if (id === 'title') delete $('title').dataset.auto; run(); }));
$('dl').addEventListener('click', async () => {
  if (!result) return;
  const name = 'BOM_' + (srcName.replace(/\.xlsx$/i, '') || 'out') + '.xlsx';
  const blob = new Blob([result.buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  let dls = null; try { dls = window.claude && await window.claude.use('downloads'); } catch (e) {}
  try {
    if (dls) await dls.save({ filename: name, data: blob });
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }
  } catch (e) { if (!e || e.code !== 'declined') { $('err').textContent = 'Preuzimanje nije uspelo: ' + (e && e.message || e); $('err').classList.remove('hide'); } }
});
